<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Intuitiveness — Descent–Ascent (animated intro)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; }
  #vroot { position: fixed; inset: 0; }

  /* entry controls — sit above the scaled canvas, always clickable */
  #entry-bar {
    position: fixed; top: 22px; right: 24px; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    font-family: "Inter", system-ui, sans-serif;
  }
  #entry-bar a { text-decoration: none; white-space: nowrap; transition: all .15s ease; cursor: pointer; }
  #skip-intro {
    color: #536471; font-size: 14px; font-weight: 600;
    padding: 9px 14px; border-radius: 999px; background: rgba(255,255,255,0.7);
  }
  #skip-intro:hover { color: #0F1419; background: #fff; }
  #enter-app {
    display: inline-flex; align-items: center; gap: 8px;
    background: #1DA1F2; color: #fff; font-size: 15px; font-weight: 700;
    padding: 11px 20px; border-radius: 999px;
    box-shadow: 0 8px 24px rgba(29,161,242,0.4);
  }
  #enter-app:hover { background: #1A91DA; transform: translateY(-1px); }
</style>
</head>
<body>
<div id="vroot"></div>
<!-- start fresh each visit; remember that the intro has been shown -->
<script>try { localStorage.removeItem('descent-ascent:t'); } catch (e) {}</script>

<nav id="entry-bar">
  <a id="skip-intro" href="/" onclick="try{localStorage.setItem('intuitiveness:intro-seen','1')}catch(e){}">Skip intro</a>
  <a id="enter-app" href="/" onclick="try{localStorage.setItem('intuitiveness:intro-seen','1')}catch(e){}">Enter the app
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
</nav>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="anim-shared.jsx"></script>
<script type="text/babel" src="anim-levels.jsx"></script>
<script type="text/babel" src="anim-main.jsx"></script>
</body>
</html>
